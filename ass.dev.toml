# Dev config: drives the mock backend (ass-mockbackend:local) instead of a real
# GPU service, so the whole orchestrator runs on a machine with no graphics card.
# Build the image first: ./scripts/build-mockbackend.sh
#
#   ./run.sh -config ass.dev.toml

[gpu]
enabled = false          # this dev box has no GPU; run backends on CPU

[server]
addr = ":2645"         # 0xA55 = "ASS" in hex

[storage]
db_path     = "data/dev/ass.db"
results_dir = "data/dev/results"

# Fake backends exercise multi-service routing, swapping and mixed artifacts.

[services.demucs]
image = "ass-mockbackend:local"
port  = 5336
verb  = "separate"        # mock returns vocals.wav + no_vocals.wav
evict = "park"
priority = 60             # keep demucs hot over the generators (higher = evicted last)
env   = { JOB_MS = "300" }

[services.yue]
image = "ass-mockbackend:local"
port  = 5340
verb  = "generate"        # mock returns audio.flac + score.abc
evict = "stop"
priority = 20             # lowest: the heavy generator, evicted first
env   = { JOB_MS = "300" }

[services.aligner]
image = "ass-mockbackend:local"
port = 8830
verb = "align"           # mock returns alignment.json, including unresolved words
evict = "stop"
priority = 40            # a utility step: outlives the generator, below always-on demucs
env = { JOB_MS = "300" }
