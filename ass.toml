# ASS configuration. Everything ASS knows lives here, because environment
# variables are how you lose an afternoon (rule 4).
#
# Full reference for every table and per-service knob (types, defaults, bind
# mounts, and how to supply a Hugging Face token): the "Configuration" section of
# README.md.

[memory]
# Big-server default. Peasants with 16GB should drop this to ~8000 and watch
# their services fall back to "stop".
ram_budget_mb = 96000

[gpu]
enabled = true         # real server has a card; hand it to whichever backend is
                       # resident. (The dev box sets this false in ass.dev.toml.)
device = 0             # the one card ASS is allowed to monopolize
vram_budget_mb = 24000 # card size minus headroom; covers pinned model + park tax
context_tax_mb = 400   # VRAM a parked (alive) process holds, charged per backend.
                       # Measured: demucs holds ~354 MiB parked on a 3090 (model
                       # weights freed, CUDA context remains) — see docs/measurements.md.

[server]
addr = ":2645"         # where ASS itself listens (0xA55 = "ASS" in hex).
                       # ":2645" binds all interfaces (0.0.0.0) — LAN-reachable.

[web]
# The human-facing web console and its operator controls (park/stop/unload-all a
# backend by hand). On by default; it shares the [server] listener, so it's on
# 0.0.0.0 too. There is NO auth yet — fine on a trusted LAN, so keep ASS off the
# open internet until there is. Set enabled = false for a strictly API-only box
# with no "free/kill the GPU" buttons exposed.
enabled = true

# --- Backends -------------------------------------------------------------

[services.demucs]
# Published to GHCR by the stem-separator repo's release workflow. Pull it with
# ./pull-services.sh (ASS never auto-pulls). `latest` = newest release; pin a
# version like :v0.1.0 if you'd rather bump deliberately.
image = "ghcr.io/stevelittlefish/stem-separator:latest"
port  = 5336
verb  = "separate"
evict = "park"          # small enough to keep parked in RAM
ram_reserve_mb = 1000
idle_ttl = "0"          # never reclaim parked RAM on the big server
shm_size_mb = 4096      # demucs wants elbow room (compose sets 4gb)
# This backend reads SEP_PORT, not the generic PORT ASS injects, so pin it to the
# published port.
env     = { SEP_PORT = "5336", SEP_MODEL = "htdemucs_ft" }
# Shared model cache convention (see README > Configuration and CLAUDE.md): EVERY
# service mounts the same /srv/ass/cache to /cache, so the HF/torch weights and
# the HF token are downloaded/written once and shared across all backends. The
# container path /cache matches the image's HF_HOME/TORCH_HOME. Outputs stay
# per-service (job scratch; ASS harvests results over HTTP anyway).
volumes = ["/srv/ass/cache:/cache", "/srv/ass/outputs/demucs:/app/outputs"]

[services.stableaudio]
# Stable Audio 3 Medium — text-to-audio generation. Forked + conformed to the
# ASS contract (artifacts[] + /result/{name} + /park + /unpark); published to
# GHCR by stable-audio-3-docker's release workflow. Pull with ./pull-services.sh.
image = "ghcr.io/stevelittlefish/stable-audio-3-docker:latest"
port  = 5335            # the image's run_api.py defaults to --port 5335
verb  = "generate"      # POST /v1/generate; returns audio.wav (+ spectrogram)
evict = "park"          # cold start reloads a multi-GB checkpoint + flash-attn,
                        # so the fast park/unpark swap earns its keep here. The
                        # peasant box (tight RAM) should switch this to "stop".
ram_reserve_mb = 8000   # rough parked-in-RAM cost of the medium model; UNMEASURED
                        # — refine once we run it on the box (see docs/measurements.md).
idle_ttl = "0"          # never reclaim parked RAM on the big server
shm_size_mb = 8192      # SA3 wants elbow room (its compose sets 8gb)
# The gated weights (stabilityai/stable-audio-3-medium) authenticate via the HF
# token in the shared cache (/srv/ass/cache/huggingface/token) — never in this
# committed file. The image's CMD already loads `--model medium`.
volumes = ["/srv/ass/cache:/cache", "/srv/ass/outputs/stableaudio:/app/outputs"]
