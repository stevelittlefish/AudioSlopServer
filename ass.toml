# ASS configuration. Everything ASS knows lives here, because environment
# variables are how you lose an afternoon (rule 4).
#
# Full reference for every table and per-service knob (types, defaults, bind
# mounts, and how to supply a Hugging Face token): the "Configuration" section of
# README.md.

[memory]
# Big-server default. Peasants with 16GB should drop this to ~8000 and watch
# their services fall back to "stop".
ram_budget_mb = 96000

[gpu]
enabled = true         # real server has a card; hand it to whichever backend is
                       # resident. (The dev box sets this false in ass.dev.toml.)
device = 0             # the one card ASS is allowed to monopolize
# The MB ASS may actually put on this card, and the real gate now: the arbiter
# sums each pinned backend's vram_pinned_mb + each parked backend's park tax and
# keeps the total under this. GPU 0 is SHARED, so this is the card MINUS what ASS
# can't touch: 24000 (3090) − ~2100 (wyoming-whisper, permanent) − ~400 (driver)
# ≈ 21500. Not the full 24GB. See docs/measurements.md.
vram_budget_mb = 21500
# max_resident is a secondary hard cap on how many backends may be pinned at once.
# 0 = unlimited: let vram_budget_mb decide (the whole point — pack as many as fit).
max_resident = 0
context_tax_mb = 400   # default parked VRAM tax for a park backend that hasn't set
                       # its own vram_parked_mb. Measured: demucs holds ~354 MiB
                       # parked on a 3090 (weights freed, CUDA context remains).

[server]
addr = ":2645"         # where ASS itself listens (0xA55 = "ASS" in hex).
                       # ":2645" binds all interfaces (0.0.0.0) — LAN-reachable.

[web]
# The human-facing web console and its operator controls (park/stop/unload-all a
# backend by hand). On by default; it shares the [server] listener, so it's on
# 0.0.0.0 too. There is NO auth yet — fine on a trusted LAN, so keep ASS off the
# open internet until there is. Set enabled = false for a strictly API-only box
# with no "free/kill the GPU" buttons exposed.
enabled = true

# --- Backends -------------------------------------------------------------

[services.demucs]
# Published to GHCR by the stem-separator repo's release workflow. Pull it with
# ./pull-services.sh (ASS never auto-pulls). `latest` = newest release; pin a
# version like :v0.1.0 if you'd rather bump deliberately.
image = "ghcr.io/stevelittlefish/stem-separator:latest"
port  = 5336
verb  = "separate"
evict = "park"          # small enough to keep parked in RAM
priority = 60           # higher = evicted LAST. demucs is a cheap, frequently-used
                        # preprocessing step, so keep it hot over the heavy generators.
vram_pinned_mb = 1200   # MEASURED peak: 554 MiB via /v1/info telemetry on the 3090.
                        # demucs is tiny; 1200 is generous headroom.
vram_parked_mb = 400    # MEASURED: 354 MiB parked on a 3090 (see docs/measurements.md).
ram_reserve_mb = 1000
idle_ttl = "0"          # never reclaim parked RAM on the big server
shm_size_mb = 4096      # demucs wants elbow room (compose sets 4gb)
# This backend reads SEP_PORT, not the generic PORT ASS injects, so pin it to the
# published port. HF_HOME/TORCH_HOME point at this service's OWN subdir under the
# shared /cache mount (see the per-service cache convention below); HF_TOKEN_PATH
# points every service at the ONE shared token file.
env     = { SEP_PORT = "5336", SEP_MODEL = "htdemucs_ft", HF_HOME = "/cache/demucs/huggingface", TORCH_HOME = "/cache/demucs/torch", HF_TOKEN_PATH = "/cache/hf-token" }
# Per-service cache convention (see README > Configuration and CLAUDE.md): EVERY
# service mounts the same /srv/ass/cache to /cache, but each owns a private subdir
# (/cache/demucs, /cache/stableaudio, /cache/acestep) so its weights are one
# deletable folder — `rm -rf /cache/<service>` and it re-downloads. These backends
# share no base weights, so a shared HF cache buys ~nothing and its content-addressed
# blobs make selective deletion error-prone; per-service wins. The ONE thing that
# IS shared is the HF token: a single file at /cache/hf-token, pointed at by every
# service's HF_TOKEN_PATH (never committed — seed it on the host once). Outputs stay
# per-service (job scratch; ASS harvests results over HTTP anyway).
volumes = ["/srv/ass/cache:/cache", "/srv/ass/outputs/demucs:/app/outputs"]

[services.stableaudio]
# Stable Audio 3 Medium — text-to-audio generation. Forked + conformed to the
# ASS contract (artifacts[] + /result/{name} + /park + /unpark); published to
# GHCR by stable-audio-3-docker's release workflow. Pull with ./pull-services.sh.
image = "ghcr.io/stevelittlefish/stable-audio-3-docker:latest"
port  = 5335            # the image's run_api.py defaults to --port 5335
verb  = "generate"      # POST /v1/generate; returns audio.wav (+ spectrogram)
evict = "park"          # cold start reloads a multi-GB checkpoint + flash-attn,
                        # so the fast park/unpark swap earns its keep here. The
                        # peasant box (tight RAM) should switch this to "stop".
priority = 50           # the default-ish middle. Evicted before demucs, after the
                        # heavier generators aren't around to throw off instead.
vram_pinned_mb = 6500   # MEASURED peak: 5388 MiB via /v1/info telemetry on the 3090.
                        # Was at 90% of the old 6000 — nudged up for headroom.
vram_parked_mb = 2000   # MEASURED: 1948 MiB parked on a 3090 — the HEAVIEST park tax
                        # of the four (flash-attn + larger workspaces). See measurements.md.
ram_reserve_mb = 8000   # rough parked-in-RAM cost of the medium model; UNMEASURED
                        # — refine once we run it on the box (see docs/measurements.md).
idle_ttl = "0"          # never reclaim parked RAM on the big server
shm_size_mb = 8192      # SA3 wants elbow room (its compose sets 8gb)
# The gated weights (stabilityai/stable-audio-3-medium) authenticate via the ONE
# shared HF token at /cache/hf-token (HF_TOKEN_PATH below) — never in this committed
# file. HF_HOME/TORCH_HOME land in this service's own /cache/stableaudio subdir. The
# image's CMD already loads `--model medium`.
env     = { HF_HOME = "/cache/stableaudio/huggingface", TORCH_HOME = "/cache/stableaudio/torch", HF_TOKEN_PATH = "/cache/hf-token" }
# The /loras mount is only needed if you load a finetune LoRA (see `command`
# below); harmless to leave when you don't. Like everything else ASS owns, the
# LoRAs live under /srv/ass — here /srv/ass/loras/stableaudio, mirroring the
# per-service outputs dir. Stage keepers there with clean names.
volumes = ["/srv/ass/cache:/cache", "/srv/ass/outputs/stableaudio:/app/outputs", "/srv/ass/loras/stableaudio:/loras:ro"]

# LoRAs. The image's default CMD loads the base `--model medium`. To load one or
# more finetune LoRAs at startup — like the standalone service's compose did —
# override the whole command with run_api.py's --lora-ckpt-path. `command`
# REPLACES the image CMD, so `--model medium` is repeated here. Load ORDER sets
# each LoRA's index in the /v1/generate `loras` array (first = index 0), which is
# the order SlopBC reads back from /v1/backends/stableaudio/info. Stage the
# .safetensors under /srv/ass/loras/stableaudio (mounted at /loras). Uncomment:
#
# command = [
#   "/app/.venv/bin/python", "/app/run_api.py",
#   "--model", "medium",
#   "--lora-ckpt-path", "/loras/limp-bizkit-4k.safetensors",   # index 0
#   # "/loras/another-style.safetensors",                      # index 1
# ]

[services.acestep]
# ACE-Step 1.5 XL — music generation (the big one: caption + lyrics -> a song).
# Forked + conformed to the ASS contract (artifacts[] + /result/{name} + /park +
# /unpark) in stevelittlefish/ACE-Step-1.5-inference-server; published to GHCR by
# that repo's container.yml on a v* tag. Pull with ./pull-services.sh.
image = "ghcr.io/stevelittlefish/ace-step-1.5-inference-server:latest"
port  = 2766            # 0xACE. NOT the image's 8001 default — that clashes with
                        # a standalone ACE-Step / gradio someone might leave on
                        # 8001. ASS publishes host:port -> container:port on the
                        # SAME number, so the container must listen here too:
                        # ACESTEP_API_PORT below is pinned to match.
verb  = "generate"      # POST /v1/generate; returns the audio clip + audio_codes
                        # blueprint + lyrics + metas as a mixed-kind artifacts[]
evict = "park"          # ACE-Step is the backend park pays off MOST for: its cold
                        # start (kill container -> reload the ~9GB DiT + re-init CUDA
                        # + re-init the LM) is the worst of the lot, while its unpark
                        # is the cheapest — because OFFLOAD_TO_CPU already keeps the
                        # VAE/text-enc/LM in CPU RAM, park only has ONE big thing to
                        # move: the DiT. So unpark ~= a single 9GB PCIe copy (~1s,
                        # SA3 territory) buys back a 10-60s reload. See the ACE-Step
                        # park analysis in docs/measurements.md. Context tax is the
                        # one number still to confirm on the box (expected 0.5-2GB;
                        # fits GPU 0's ~21.5GB usable with room to spare).
priority = 30           # a heavy generator: cheaper to the swap decision than the
                        # small always-on services, so it gets thrown off before them.
vram_pinned_mb = 16000  # MEASURED peak: 13850 MiB via /v1/info telemetry on the 3090 —
                        # the old 10000 was 39% too LOW and would have overcommitted the
                        # card. Set above the observed peak; watch it as more jobs land.
vram_parked_mb = 700    # MEASURED: 616 MiB parked on a 3090 — SMALL, despite the XL
                        # DiT. OFFLOAD_TO_CPU already keeps most weights off the card, so
                        # park leaves little behind. (Predicted 0.5-2GB; landed low.)
ram_reserve_mb = 14000  # parked-in-RAM estimate: DiT ~9GB + LM 1.7B ~3.5GB + Qwen
                        # text-enc ~1.2GB + VAE ~0.3GB. Still UNMEASURED — refine on
                        # the box (see docs/measurements.md method).
idle_ttl = "0"          # never reclaim parked RAM on the big server
shm_size_mb = 8192      # generation wants elbow room
# This backend reads ACESTEP_API_PORT, not the generic PORT ASS injects, so pin it
# to the published port. ACESTEP_MODE=api runs the REST server (not Gradio).
# ACESTEP_CHECKPOINTS_DIR: ACE-Step's DiT/VAE loader does NOT use the HF hub
# cache (HF_HOME) — it snapshot_downloads into a flat `checkpoints/` local_dir,
# which defaults to /app/checkpoints (unmounted → wiped every restart → it
# re-downloads GBs on every boot). Point it inside this service's own /cache subdir
# so the weights land in the per-service cache and persist. Not a new mount — /cache
# is already mounted below. (HF_HOME=/cache/acestep/huggingface still covers the
# transformers bits — tokenizers, the Qwen text-encoder — which DO honor the hub cache.)
# The DiT + LM defaults (acestep-v15-xl-turbo + acestep-5Hz-lm-1.7B) are now
# baked into the image, so they're not repeated here. What IS deployment-specific
# and replicates the old known-good box:
#   ACESTEP_INIT_LLM=true      - load the planner at startup (needed for thinking)
#   ACESTEP_LM_BACKEND=pt       - NOT vllm: pt offloads the planner to CPU between
#                                 steps instead of greedily pinning VRAM, so the
#                                 card can be shared/parked.
#   ACESTEP_OFFLOAD_TO_CPU=true, ACESTEP_LM_OFFLOAD_TO_CPU=true - keep VAE/text-
#                                 encoder + LM in CPU RAM except when in use. ~1s
#                                 per render; matches what ran clean on the 3090.
env     = { ACESTEP_API_PORT = "2766", ACESTEP_MODE = "api", HF_HOME = "/cache/acestep/huggingface", TORCH_HOME = "/cache/acestep/torch", ACESTEP_CHECKPOINTS_DIR = "/cache/acestep/checkpoints", HF_TOKEN_PATH = "/cache/hf-token", ACESTEP_INIT_LLM = "true", ACESTEP_LM_BACKEND = "pt", ACESTEP_OFFLOAD_TO_CPU = "true", ACESTEP_LM_OFFLOAD_TO_CPU = "true" }
# Per-service /cache convention, same as every other backend: the transformers bits
# (tokenizer, Qwen text-encoder) load from HF_HOME=/cache/acestep/huggingface and the
# DiT/VAE/LM snapshot into /cache/acestep/checkpoints — all under this service's own
# deletable subdir, authenticating via the ONE shared token at /cache/hf-token
# (HF_TOKEN_PATH). No bespoke /app/checkpoints mount — nothing durable lands outside
# /cache.
volumes = ["/srv/ass/cache:/cache", "/srv/ass/outputs/acestep:/app/outputs"]

[services.yue]
# YuE2-3B — text-to-music: style + lyrics -> an editable ABC score -> semantic
# tokens -> a song. Forked + conformed to the ASS contract (artifacts[] +
# /result/{name} + /park + /unpark) in stevelittlefish/YuE-inference-server;
# published to GHCR by that repo's container.yml on a v* tag. Pull with
# ./pull-services.sh.
image = "ghcr.io/stevelittlefish/yue-inference-server:latest"
port  = 5340            # YuE. ASS maps host:port -> container:port on the same
                        # number, so the container must listen here too:
                        # YUE_API_PORT below is pinned to match.
verb  = "generate"      # POST /v1/generate; returns audio.flac + score.abc + the
                        # lyrics + result/config metadata as a mixed-kind artifacts[]
evict = "park"          # YuE2-3B has a heavy cold start (3B model reload + CUDA
                        # re-init), so like ACE-Step it should earn the fast park/
                        # unpark swap. /park + /unpark ARE implemented. Parked-VRAM
                        # (context tax) and unpark latency are still UNMEASURED —
                        # confirm on the box (docs/measurements.md) and drop back to
                        # "stop" only if the numbers don't justify holding it in RAM.
priority = 20           # low: the heaviest generator, happy to give up the card the
                        # moment anything else wants it (only the aligner ranks lower).
no_preload = true       # don't warm YuE on "preload all": it's a big RAM/VRAM hog and
                        # not every session uses it — let it cold-start on first demand.
vram_pinned_mb = 10500  # MEASURED peak: 9486 MiB via /v1/info telemetry on the 3090 —
                        # the old 8000 was 19% too low. Set above the observed peak.
vram_parked_mb = 1100   # MEASURED: 1042 MiB parked on a 3090. See docs/measurements.md.
ram_reserve_mb = 10000  # rough parked-in-RAM guess for the 3B model; UNMEASURED —
                        # refine on the box before trusting it.
idle_ttl = "0"          # never reclaim parked RAM on the big server
shm_size_mb = 8192      # generation wants elbow room
# This backend reads YUE_API_PORT, not the generic PORT ASS injects, so pin it.
# HF_HOME/TORCH_HOME point at THIS service's own /cache/yue subdir (its weights
# come from the ordinary HF hub cache, unlike ACE-Step's flat checkpoints dir);
# HF_TOKEN_PATH is the one shared token every backend reads. YuE2's default torch
# backend is deliberate — vllm would greedily pin VRAM and fight park/share.
env = { YUE_API_PORT = "5340", HF_HOME = "/cache/yue/huggingface", TORCH_HOME = "/cache/yue/torch", HF_TOKEN_PATH = "/cache/hf-token" }
volumes = ["/srv/ass/cache:/cache", "/srv/ass/outputs/yue:/app/outputs"]

[services.aligner]
# Forced alignment: vocal audio + known lyrics -> alignment.json (word/line times).
# Release the prepared forced-aligner image before pulling this new service.
image = "ghcr.io/stevelittlefish/forced-aligner:latest"
port = 8830
verb = "align"
evict = "park"         # /park + /unpark implemented (model -> CPU RAM and back), so
                       # a swap costs a PCIe copy, not a container cold start. ASS still
                       # harvests the JSON before parking. Peasant box: switch to "stop".
priority = 10          # very low: a quick utility step, happy to be thrown off the
                       # card the moment anything else wants it. Evicted first of all.
no_preload = true      # keep it out of "preload all": now that it's parkable this DOES
                       # bite — don't warm the aligner into RAM eagerly, it's a big
                       # reserve and not every session aligns. Cold-starts on first job.
vram_pinned_mb = 14000 # ESTIMATE, UNMEASURED: headroom over a historical ~9.9 GB
                       # reserved spike on a 10-minute track. One language model
                       # resident; long audio can still exceed this reservation.
vram_parked_mb = 500   # MEASURED: 332 MiB parked on a 3090 (ass-aligner, 2026-09-19 —
                       # just the CUDA context, weights on CPU). Kept at 500 for headroom
                       # and to match gpu.context_tax_mb, which this falls back to if
                       # deleted. See docs/measurements.md.
ram_reserve_mb = 6000  # ESTIMATE, UNMEASURED: model, decoded audio, alignment scratch
idle_ttl = "0"
shm_size_mb = 2048
# Image includes its TOML defaults (CUDA, English preload, port 8830). These env
# vars configure third-party library caches only. WhisperX's model_dir is set
# in the baked TOML to /cache/aligner/models. Weights survive stop OR park eviction.
env = { HF_HOME = "/cache/aligner/huggingface", TORCH_HOME = "/cache/aligner/torch", HF_TOKEN_PATH = "/cache/hf-token" }
volumes = ["/srv/ass/cache:/cache"]
# No outputs mount: ASS owns the harvested result, container scratch is disposable.
