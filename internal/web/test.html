<!doctype html>
<html lang="en" data-page="test">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASS · test</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="stylesheet" href="/assets/test.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/admin" title="Back to the dashboard">
    <img class="logomark" src="/assets/logo-bars.svg" width="26" height="26" alt="">
    <span class="logo">ass</span>
    <span class="sub"><b id="svcname">service</b> · <span id="svcverb">test</span></span>
  </a>
  <span class="spacer"></span>
  <a class="back" href="/admin">‹ admin</a>
</header>

<main>
  <section class="panel" id="formpanel">
    <h2>Submit a job (generic)</h2>
    <p class="hint">This service has no bespoke test page yet, so here's the raw form: hand it the params JSON your backend expects, pick how to encode it, optionally attach a file. POST /v1/&lt;service&gt;/jobs.</p>
    <div id="form">
      <div class="field"><label>Params (JSON)</label>
        <textarea data-p="__raw" placeholder='{"prompt":"..."}'>{}</textarea></div>
      <div class="row">
        <div class="field"><label>Encoding</label>
          <div class="seg" data-seg="encoding">
            <button type="button" data-v="json" class="on">JSON body</button>
            <button type="button" data-v="blob">multipart · params</button>
            <button type="button" data-v="paramobj">multipart · param_obj</button>
          </div></div>
      </div>
      <div class="field">
        <label>Optional input file (multipart field name below)</label>
        <div class="drop" data-field="audio">
          <div>Drop a file here or <b>browse</b></div><div class="chosen" hidden></div>
          <input type="file" accept="audio/*,.wav,.flac,.mp3,.m4a,.ogg" hidden>
        </div>
      </div>
      <div class="field"><label>File field name</label><input type="text" data-p="__field" placeholder="audio"></div>
    </div>
    <div style="margin-top:6px;"><button class="primary" id="submit" disabled>Run</button></div>
  </section>

  <section class="panel" id="resultpanel" hidden>
    <h2>Result</h2>
    <div class="status" id="status"></div>
    <div class="art" id="art" style="margin-top:16px;"></div>
  </section>
</main>

<div class="toast" id="toast"></div>
<script src="/assets/test-common.js"></script>
<script>
"use strict";
window.ASS_TEST = {
  build(root){
    const params = JSON.parse(val(root,"__raw") || "{}"); // throws -> toasted
    const f = getFile("audio");
    let enc = seg(root,"encoding") || "json";
    const field = val(root,"__field") || "audio";
    // A file needs a multipart encoding; nudge json -> blob so the file rides along.
    if (f && enc === "json") enc = "blob";
    return { params, files: f ? [{field, file:f}] : [], encoding: enc };
  },
};
</script>
</body>
</html>
